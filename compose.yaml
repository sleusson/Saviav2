services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: savia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: savia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savia -d savia"]
      interval: 5s
      retries: 12
    networks: [internal]
  web:
    build: ./server
    restart: unless-stopped
    environment: &env
      DATABASE_URL: postgresql://savia:${POSTGRES_PASSWORD}@db:5432/savia
      MQTT_BROKER: test.mosquitto.org
      MQTT_PORT: '1883'
      MQTT_BASE: uao/invernadero/477744536654042113/v2
      CSV_PATH: /data/lecturas.csv
      SAVIA_DEVICE_TOKEN: ${SAVIA_DEVICE_TOKEN:-}
    depends_on:
      db: {condition: service_healthy}
    volumes: [csvdata:/data]
    ports: ["127.0.0.1:8000:8000"]
    networks: [internal]
  collector:
    build: ./server
    command: ["python", "-u", "worker.py"]
    restart: unless-stopped
    environment: *env
    depends_on:
      db: {condition: service_healthy}
    volumes: [csvdata:/data]
    networks: [internal]
volumes:
  pgdata:
  csvdata:
networks:
  internal:
